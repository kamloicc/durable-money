name: Release packages and deploy Development

on:
  push:
    branches:
      - main
    paths:
      - '1-monolith/**'
      - 'octopus/package/linux/Deploy.sh'
      - 'octopus/package/windows/Deploy.ps1'
      - 'octopus/kubernetes/monolith.yaml'
      - '.github/workflows/release-main.yml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover runnable services
    runs-on: ubuntu-latest
    outputs:
      package-matrix: ${{ steps.matrix.outputs.package-matrix }}
      container-matrix: ${{ steps.matrix.outputs.container-matrix }}
      release-version: ${{ steps.version.outputs.release-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This release workflow must run from the main branch."
            exit 1
          fi

          version="0.2.${GITHUB_RUN_NUMBER}"

          echo "release-version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Build matrices from Dockerfile and pom.xml folders
        id: matrix
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import re

          services = []
          for dockerfile in pathlib.Path('1-monolith∑').rglob('Dockerfile'):
              directory = dockerfile.parent
              if not (directory / 'pom.xml').is_file():
                  continue

              path = directory.as_posix()
              service_id = re.sub(r'[^a-z0-9]+', '-', path.lower()).strip('-')
              package_base = re.sub(r'^\d+-', '', service_id)

              services.append(
                  {
                      'id': service_id,
                      'path': path,
                      'package_id': f'durable-money-{package_base}',
                  }
              )

          services.sort(key=lambda item: item['path'])
          if not services:
              raise SystemExit(
                  'No folder containing both Dockerfile and pom.xml was found'
              )

          package_rows = []
          for service in services:
              package_rows.append(
                  {**service, 'os': 'ubuntu-latest', 'platform': 'linux'}
              )
              package_rows.append(
                  {**service, 'os': 'windows-latest', 'platform': 'windows'}
              )

          package_matrix = json.dumps(
              {'include': package_rows},
              separators=(',', ':'),
          )
          container_matrix = json.dumps(
              {'include': services},
              separators=(',', ':'),
          )

          with open(
              os.environ['GITHUB_OUTPUT'],
              'a',
              encoding='utf-8',
          ) as output:
              output.write(f'package-matrix={package_matrix}\n')
              output.write(f'container-matrix={container_matrix}\n')

          print('Runnable services:')
          for service in services:
              print(
                  f"- {service['id']}: {service['path']} "
                  f"(package base: {service['package_id']})"
              )
          PY

  package:
    name: Package ${{ matrix.id }} for ${{ matrix.platform }}
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.package-matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and test with Maven
        run: mvn -B -ntp -f "${{ matrix.path }}/pom.xml" clean verify

      - name: Create self-contained Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          jar="$(
            find '${{ matrix.path }}/target' \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name 'original-*.jar' |
              head -n 1
          )"
          test -n "$jar"

          app_name='durable-money-${{ matrix.id }}'
          input_dir='package-input/${{ matrix.id }}'
          jpackage_dir='dist/jpackage-${{ matrix.id }}'
          bundle='dist/${{ matrix.id }}-linux'
          package_id='${{ matrix.package_id }}-linux'
          version='${{ needs.discover.outputs.release-version }}'
          package_file="dist/${package_id}.${version}.tar.gz"

          rm -rf "$input_dir" "$jpackage_dir" "$bundle"
          mkdir -p "$input_dir" "$jpackage_dir"

          cp "$jar" "$input_dir/app.jar"

          jpackage \
            --type app-image \
            --input "$input_dir" \
            --main-jar app.jar \
            --name "$app_name" \
            --dest "$jpackage_dir" \
            --java-options '-XX:MaxRAMPercentage=75' \
            --java-options '-XX:+ExitOnOutOfMemoryError'

          mv "$jpackage_dir/$app_name" "$bundle"

          if [[ '${{ matrix.id }}' == '1-monolith' ]]; then
            install \
              -m 0755 \
              octopus/package/linux/Deploy.sh \
              "$bundle/Deploy.sh"

            test -x "$bundle/Deploy.sh"
          fi
          tar -C "$bundle" -czf "$GITHUB_WORKSPACE/$package_file" .

          echo "Created $package_file"

          contents_file="$RUNNER_TEMP/package-contents.txt"
          tar -tzf "$package_file" > "$contents_file"
          head -n 30 "$contents_file"

      - name: Create self-contained Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jar = Get-ChildItem '${{ matrix.path }}/target/*.jar' |
            Where-Object { $_.Name -notlike 'original-*.jar' } |
            Select-Object -First 1

          if (-not $jar) {
            throw 'No executable Spring Boot JAR was found'
          }

          $appName = 'durable-money-${{ matrix.id }}'
          $inputDir = 'package-input/${{ matrix.id }}'
          $jpackageDir = 'dist/jpackage-${{ matrix.id }}'
          $bundle = 'dist/${{ matrix.id }}-windows'
          $packageId = '${{ matrix.package_id }}-windows'
          $version = '${{ needs.discover.outputs.release-version }}'
          $packageFile = "dist/$packageId.$version.zip"

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $inputDir, $jpackageDir, $bundle

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $inputDir, $jpackageDir |
            Out-Null

          Copy-Item $jar.FullName "$inputDir/app.jar"

          jpackage `
            --type app-image `
            --input $inputDir `
            --main-jar app.jar `
            --name $appName `
            --dest $jpackageDir `
            --java-options '-XX:MaxRAMPercentage=75' `
            --java-options '-XX:+ExitOnOutOfMemoryError'

          Move-Item "$jpackageDir/$appName" $bundle

          if ('${{ matrix.id }}' -eq '1-monolith') {
            Copy-Item `
              -LiteralPath 'octopus/package/windows/Deploy.ps1' `
              -Destination (Join-Path $bundle 'Deploy.ps1') `
              -Force

            $deployScript = Join-Path $bundle 'Deploy.ps1'

            if (-not (
              Test-Path `
                -LiteralPath $deployScript `
                -PathType Leaf
            )) {
              throw "The Windows Deploy.ps1 package script is missing."
            }
          }

          $serviceToolsDir = Join-Path $bundle 'service'
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $serviceToolsDir |
            Out-Null

          $winSwVersion = '2.12.0'
          $winSwUrl = "https://github.com/winsw/winsw/releases/download/v$winSwVersion/WinSW-x64.exe"
          $winSwLicenseUrl = "https://raw.githubusercontent.com/winsw/winsw/v$winSwVersion/LICENSE.txt"

          $ProgressPreference = 'SilentlyContinue'

          Invoke-WebRequest `
            -Uri $winSwUrl `
            -OutFile (Join-Path $serviceToolsDir 'winsw.exe')

          Invoke-WebRequest `
            -Uri $winSwLicenseUrl `
            -OutFile (Join-Path $serviceToolsDir 'WinSW-LICENSE.txt')

          $winSwFile = Get-Item (Join-Path $serviceToolsDir 'winsw.exe')
          if ($winSwFile.Length -lt 100000) {
            throw "The downloaded WinSW executable is unexpectedly small: $($winSwFile.Length) bytes"
          }

          Compress-Archive `
            -Path "$bundle/*" `
            -DestinationPath $packageFile `
            -Force

          Write-Host "Created $packageFile"
          Write-Host "Bundled WinSW $winSwVersion for Windows service installation"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-${{ matrix.platform }}-${{ needs.discover.outputs.release-version }}
          path: dist/${{ matrix.package_id }}-${{ matrix.platform }}.${{ needs.discover.outputs.release-version }}.*
          if-no-files-found: error
          retention-days: 14

      - name: Push monolith package to Octopus Deploy
        if: matrix.id == '1-monolith'
        uses: OctopusDeploy/push-package-action@v4
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
        with:
          packages: dist/${{ matrix.package_id }}-${{ matrix.platform }}.${{ needs.discover.outputs.release-version }}.*
          overwrite_mode: IgnoreIfExists

  container:
    name: Container ${{ matrix.id }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.container-matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/durable-money-${{ matrix.id }}
          tags: |
            type=raw,value=${{ needs.discover.outputs.release-version }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

  release:
    name: Release monolith to Octopus Development
    if: github.ref == 'refs/heads/main'
    needs:
      - discover
      - package
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
      RELEASE_VERSION: ${{ needs.discover.outputs.release-version }}
      OCTOPUS_PROJECT: Durable Money - Monolith

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push monolith build information to Octopus Deploy
        uses: OctopusDeploy/push-build-information-action@v4
        with:
          packages: |
            durable-money-monolith-linux
            durable-money-monolith-windows
            ${{ github.repository_owner }}/durable-money-1-monolith
          version: ${{ env.RELEASE_VERSION }}
          branch: ${{ github.ref_name }}
          overwrite_mode: IgnoreIfExists

      - name: Create monolith release in Octopus Deploy
        id: create_release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: ${{ env.OCTOPUS_PROJECT }}
          release_number: ${{ env.RELEASE_VERSION }}
          channel: Stable
          git_ref: refs/heads/main
          git_commit: ${{ github.sha }}
          git_resources: |
            Deploy monolith to AKS:refs/heads/main
          packages: |
            durable-money-monolith-linux:${{ env.RELEASE_VERSION }}
            durable-money-monolith-windows:${{ env.RELEASE_VERSION }}
            ${{ github.repository_owner }}/durable-money-1-monolith:${{ env.RELEASE_VERSION }}
          ignore_existing: true
          release_notes: |
            Automated release created by GitHub Actions.

            - Repository: `${{ github.repository }}`
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Deploy monolith release to Development
        id: deploy_development
        uses: OctopusDeploy/deploy-release-action@v4
        with:
          project: ${{ env.OCTOPUS_PROJECT }}
          release_number: ${{ env.RELEASE_VERSION }}
          environments: |
            Development
          use_guided_failure: false

      - name: Wait for Development deployment
        uses: OctopusDeploy/await-task-action@v4
        with:
          server_task_id: ${{ fromJSON(steps.deploy_development.outputs.server_tasks)[0].serverTaskId }}
          polling_interval: 10
          timeout_after: 1800
          hide_progress: false

      - name: Write Octopus deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Octopus Development deployment"
            echo
            echo "- Project: ${OCTOPUS_PROJECT}"
            echo "- Release: ${RELEASE_VERSION}"
            echo "- Environment: Development"
            echo "- Linux package: durable-money-monolith-linux ${RELEASE_VERSION}"
            echo "- Windows package: durable-money-monolith-windows ${RELEASE_VERSION}"
            echo "- Container image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/durable-money-1-monolith:${RELEASE_VERSION}"
            echo "- Result: successful"
          } >> "$GITHUB_STEP_SUMMARY"
