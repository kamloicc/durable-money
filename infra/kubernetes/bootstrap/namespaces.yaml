apiVersion: v1
kind: Namespace
metadata:
  name: durable-money-dev
  labels:
    app.kubernetes.io/part-of: durable-money
    durable-money/environment: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: durable-money-quota
  namespace: durable-money-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "30"
---
apiVersion: v1
kind: Namespace
metadata:
  name: durable-money-staging
  labels:
    app.kubernetes.io/part-of: durable-money
    durable-money/environment: staging
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: durable-money-quota
  namespace: durable-money-staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "30"
---
apiVersion: v1
kind: Namespace
metadata:
  name: durable-money-prod
  labels:
    app.kubernetes.io/part-of: durable-money
    durable-money/environment: prod
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: durable-money-quota
  namespace: durable-money-prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "50"
---
apiVersion: v1
kind: Namespace
metadata:
  name: octopus
  labels:
    app.kubernetes.io/name: octopus-kubernetes-agent
