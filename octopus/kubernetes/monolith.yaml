apiVersion: v1
kind: Secret
metadata:
  name: durable-money-monolith-db
  namespace: #{Library.DurableMoney.Kubernetes.Namespace}
  labels:
    app.kubernetes.io/name: durable-money-monolith
    app.kubernetes.io/managed-by: octopus-deploy
type: Opaque
stringData:
  username: "#{Project.Database.Username}"
  password: "#{Project.Database.Password}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Project.Kubernetes.DeploymentName}
  namespace: #{Library.DurableMoney.Kubernetes.Namespace}
  labels:
    app.kubernetes.io/name: durable-money-monolith
    app.kubernetes.io/managed-by: octopus-deploy
  annotations:
    durable-money.demo/source: "github"
    durable-money.demo/release: "#{Octopus.Release.Number}"
    durable-money.demo/manifest: "octopus/kubernetes/monolith.yaml"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: durable-money-monolith
  template:
    metadata:
      labels:
        app.kubernetes.io/name: durable-money-monolith
        app.kubernetes.io/managed-by: octopus-deploy
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: monolith
          image: "#{Octopus.Action.Package[monolith-image].Image}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: #{Project.Kubernetes.ContainerPort}
              protocol: TCP
          env:
            - name: PORT
              value: "#{Project.Kubernetes.ContainerPort}"
            - name: MANAGEMENT_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "#{Project.Database.JdbcUrl}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: durable-money-monolith-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: durable-money-monolith-db
                  key: password
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "#{Project.Database.Pool.MaximumSize}"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "#{Project.Database.Pool.MinimumIdle}"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: #{Project.Kubernetes.ServiceName}
  namespace: #{Library.DurableMoney.Kubernetes.Namespace}
  labels:
    app.kubernetes.io/name: durable-money-monolith
    app.kubernetes.io/managed-by: octopus-deploy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: durable-money-monolith
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
