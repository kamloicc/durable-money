apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: durable-money
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: account-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-service
        app.kubernetes.io/part-of: durable-money

    spec:
      containers:
        - name: account-service
          image: ghcr.io/kamloicc/durable-money-2-microservices-account-service:0.3.1

          ports:
            - name: http
              containerPort: 9080

            - name: management
              containerPort: 9081

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username

            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password

          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
