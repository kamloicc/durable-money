apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-service
  labels:
    app.kubernetes.io/name: transfer-service
    app.kubernetes.io/part-of: durable-money
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: transfer-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: transfer-service
        app.kubernetes.io/part-of: durable-money

    spec:
      containers:
        - name: transfer-service
          image: ghcr.io/kamloicc/durable-money-2-microservices-transfer-service:0.3.1

          ports:
            - name: http
              containerPort: 8080

            - name: management
              containerPort: 8081

          env:
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service:9080

          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
