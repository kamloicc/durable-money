apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: transfer-development
  namespace: argocd

  annotations:
    argo.octopus.com/project: northfield-transfer-service
    argo.octopus.com/environment: development

spec:
  project: default

  source:
    repoURL: https://github.com/kamloicc/durable-money.git
    targetRevision: main
    path: gitops/transfer-service/overlays/development

  destination:
    server: https://kubernetes.default.svc
    namespace: durable-money-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
